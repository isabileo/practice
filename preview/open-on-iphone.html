<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aura" />
  <title>Aura — Open on iPhone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --void: #080a12;
  --abyss: #121622;
  --ember: #ff8c2e;
  --molten: #ffc752;
  --ice: #8cd1ff;
  --mist: rgba(255, 255, 255, 0.7);
  --phone-w: 440px;
  --phone-h: 956px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  min-height: 100%;
  background:
    radial-gradient(ellipse 60% 40% at 70% 10%, rgba(255, 140, 46, 0.18), transparent 55%),
    radial-gradient(ellipse 50% 45% at 20% 90%, rgba(60, 90, 140, 0.25), transparent 50%),
    linear-gradient(160deg, #0a0c14, #151925 55%, #0d1018);
  color: #fff;
  font-family: "Outfit", sans-serif;
}

.stage {
  min-height: 100vh;
  display: grid;
  place-items: center;
  gap: 28px;
  padding: 32px 16px 48px;
}

.phone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.phone-bezel {
  width: min(var(--phone-w), calc(100vw - 32px));
  aspect-ratio: 440 / 956;
  border-radius: 54px;
  padding: 10px;
  background: linear-gradient(145deg, #2a2e38, #0c0e14 40%, #1a1d26);
  box-shadow:
    0 40px 80px rgba(0, 0, 0, 0.55),
    inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}

.screen {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 44px;
  overflow: hidden;
  background: linear-gradient(180deg, var(--void), var(--abyss));
  isolation: isolate;
}

.screen.is-charging .orb-a {
  transform: translate(18px, -12px) scale(1.08);
  opacity: 0.9;
}

.screen.is-charging .orb-b {
  transform: translate(-14px, 20px) scale(1.1);
}

.island {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 36px;
  border-radius: 20px;
  background: #000;
  z-index: 5;
}

.status-bar {
  position: absolute;
  top: 18px;
  left: 28px;
  right: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 4;
  font-size: 15px;
  font-weight: 600;
}

.status-glyphs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}

.bars {
  width: 17px;
  height: 10px;
  background:
    linear-gradient(#fff, #fff) 0 100% / 3px 40%,
    linear-gradient(#fff, #fff) 5px 100% / 3px 55%,
    linear-gradient(#fff, #fff) 10px 100% / 3px 75%,
    linear-gradient(#fff, #fff) 15px 100% / 3px 100%;
  background-repeat: no-repeat;
}

.wifi {
  width: 14px;
  height: 10px;
  border: 2px solid transparent;
  border-top-color: #fff;
  border-radius: 50%;
  position: relative;
}

.wifi::after {
  content: "";
  position: absolute;
  inset: 3px 2px auto;
  height: 6px;
  border: 2px solid transparent;
  border-top-color: #fff;
  border-radius: 50%;
}

.battery-pill {
  min-width: 28px;
  padding: 2px 6px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.18);
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.screen.is-charging .battery-pill {
  background: var(--ember);
  color: #120a00;
  font-weight: 700;
}

.live-activity {
  position: absolute;
  top: 64px;
  left: 18px;
  right: 18px;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 22px;
  background: rgba(8, 10, 18, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(16px);
  animation: slideDown 0.55s cubic-bezier(0.22, 1, 0.36, 1);
}

.live-activity[hidden] {
  display: none;
}

.la-ring {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.12);
  border-top-color: var(--ember);
  border-right-color: var(--molten);
  animation: spin 2.8s linear infinite;
}

.la-copy {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.la-copy strong {
  font-size: 14px;
  font-weight: 600;
}

.la-copy span {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.5);
}

.la-pct {
  font-size: 24px;
  font-weight: 200;
  font-variant-numeric: tabular-nums;
}

.lock {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 110px 24px 48px;
}

.brand {
  font-size: clamp(28px, 7vw, 34px);
  font-weight: 700;
  letter-spacing: 0.35em;
  margin-left: 0.35em;
}

.device {
  margin-top: 8px;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.42);
  font-weight: 400;
}

.ring-wrap {
  position: relative;
  width: min(72%, 280px);
  aspect-ratio: 1;
  margin: auto 0;
}

.ring {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  filter: drop-shadow(0 0 18px rgba(255, 140, 46, 0.28));
  transition: filter 0.5s ease;
}

.screen.is-charging .ring {
  filter: drop-shadow(0 0 28px rgba(255, 140, 46, 0.55));
  animation: breathe 2.4s ease-in-out infinite;
}

.ring-track {
  fill: none;
  stroke: rgba(255, 255, 255, 0.08);
  stroke-width: 10;
}

.ring-progress {
  fill: none;
  stroke: url(#none);
  stroke: var(--ember);
  stroke-width: 10;
  stroke-linecap: round;
  stroke-dasharray: 540;
  stroke-dashoffset: 194;
  transition: stroke-dashoffset 0.6s ease;
}

.screen.is-charging .ring-progress {
  stroke: var(--molten);
}

.ring-core {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  gap: 2px;
}

.bolt {
  width: 26px;
  height: 26px;
  margin: 0 auto 4px;
  opacity: 0.25;
  transition: opacity 0.4s ease, transform 0.4s ease;
  fill: var(--molten);
}

.screen.is-charging .bolt {
  opacity: 1;
  animation: pulseBolt 1.1s ease-in-out infinite;
}

.percent {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 2px;
  line-height: 1;
}

.percent span {
  font-size: clamp(56px, 14vw, 72px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
}

.percent small {
  font-size: 24px;
  font-weight: 300;
  color: var(--mist);
  padding-bottom: 8px;
}

.charge-label {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.28em;
  color: rgba(255, 255, 255, 0.4);
}

.screen.is-charging .charge-label {
  color: var(--ember);
}

.watts {
  font-size: 15px;
  color: var(--mist);
  font-weight: 400;
  min-height: 1.4em;
  text-align: center;
}

.fast-badge {
  margin-top: 14px;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: #140a00;
  background: linear-gradient(135deg, var(--molten), #ffe08a);
  animation: badgeIn 0.45s ease;
}

.fast-badge[hidden],
.meters[hidden] {
  display: none;
}

.fast-badge.is-standard {
  color: var(--mist);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
}

.meters {
  display: flex;
  align-items: stretch;
  width: min(100%, 320px);
  margin-top: 14px;
  padding: 12px 4px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.meter {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.meter-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: rgba(255, 255, 255, 0.42);
}

.meter-value {
  font-size: 17px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.meter-divider {
  width: 1px;
  background: rgba(255, 255, 255, 0.12);
  margin: 4px 0;
}

.flower-field {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  width: 100%;
  height: 100%;
}

.scene-label {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 42px;
  z-index: 5;
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: rgba(255, 255, 255, 0.55);
  pointer-events: none;
}

.charge-socket {
  position: absolute;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  z-index: 4;
  width: 72px;
  height: 28px;
  pointer-events: none;
}

.charge-socket[hidden] {
  display: none;
}

.socket-glow {
  position: absolute;
  inset: -18px -10px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 199, 82, 0.55), transparent 70%);
  animation: socketPulse 1.6s ease-in-out infinite;
}

.socket-port {
  position: absolute;
  left: 50%;
  bottom: 2px;
  transform: translateX(-50%);
  width: 28px;
  height: 5px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 12px rgba(255, 199, 82, 0.8);
}

.orbs {
  pointer-events: none;
  position: absolute;
  inset: 0;
  z-index: 1;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  transition: transform 2.4s ease, opacity 0.8s ease;
}

.orb-a {
  width: 240px;
  height: 240px;
  top: 8%;
  right: -10%;
  background: rgba(255, 140, 46, 0.22);
}

.orb-b {
  width: 220px;
  height: 220px;
  bottom: 12%;
  left: -12%;
  background: rgba(80, 140, 200, 0.18);
}

.caption {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.4);
  letter-spacing: 0.04em;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: min(360px, 100%);
}

.cta {
  appearance: none;
  border: 0;
  border-radius: 18px;
  padding: 16px 20px;
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  color: #140a00;
  background: linear-gradient(135deg, var(--ember), #ffc857);
  cursor: pointer;
  transition: transform 0.2s ease, filter 0.2s ease;
}

.cta:hover {
  filter: brightness(1.05);
}

.cta:active {
  transform: scale(0.98);
}

.cta[aria-pressed="true"] {
  color: #fff;
  background: linear-gradient(135deg, #2a3144, #1a2030);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}

.slider-label {
  display: grid;
  gap: 8px;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.55);
}

.slider-label input {
  width: 100%;
  accent-color: var(--ember);
}

@keyframes breathe {
  0%,
  100% {
    transform: rotate(-90deg) scale(1);
  }
  50% {
    transform: rotate(-90deg) scale(1.02);
  }
}

@keyframes pulseBolt {
  0%,
  100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.12);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes badgeIn {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes socketPulse {
  0%,
  100% {
    opacity: 0.65;
    transform: scale(0.92);
  }
  50% {
    opacity: 1;
    transform: scale(1.05);
  }
}

@media (max-width: 480px) {
  .stage {
    padding-top: 16px;
  }

  .phone-bezel {
    border-radius: 0;
    padding: 0;
    width: 100%;
    max-width: none;
    aspect-ratio: auto;
    min-height: 100dvh;
    box-shadow: none;
    background: transparent;
  }

  .screen {
    border-radius: 0;
    min-height: 100dvh;
  }

  .caption {
    display: none;
  }
}


/* iPhone: keep Connect charger on screen */
@media (max-width: 480px) {
  .stage {
    padding: 0;
    gap: 0;
    min-height: 100dvh;
  }
  .phone {
    width: 100%;
  }
  .controls {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 50;
    width: auto;
    max-width: none;
    padding: 12px;
    border-radius: 20px;
    background: rgba(8, 10, 18, 0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .cta {
    padding: 14px 16px;
  }
}

  </style>
</head>
<body>
  <main class="stage">
    <div class="phone" aria-label="iPhone 17 Pro Max preview">
      <div class="phone-bezel">
        <div class="screen" id="screen">
          <div class="island" aria-hidden="true"></div>

          <header class="status-bar">
            <time id="clock">9:41</time>
            <div class="status-glyphs" aria-hidden="true">
              <span class="bars"></span>
              <span class="wifi"></span>
              <span class="battery-pill" id="statusBattery">64</span>
            </div>
          </header>

          <aside class="live-activity" id="liveActivity" hidden>
            <div class="la-ring" aria-hidden="true"></div>
            <div class="la-copy">
              <strong>Charging with Aura</strong>
              <span>iPhone 17 Pro Max</span>
            </div>
            <div class="la-pct" id="laPercent">64%</div>
          </aside>

          <section class="lock" id="lock">
            <p class="brand">AURA</p>
            <p class="device">iPhone 17 Pro Max</p>

            <div class="ring-wrap">
              <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
                <circle class="ring-track" cx="100" cy="100" r="86" />
                <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="86" />
              </svg>
              <div class="ring-core">
                <svg class="bolt" id="bolt" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" />
                </svg>
                <div class="percent">
                  <span id="percent">64</span><small>%</small>
                </div>
                <p class="charge-label" id="chargeLabel">ON BATTERY</p>
              </div>
            </div>

            <p class="watts" id="watts">Plug in to wake Aura</p>
            <div class="fast-badge" id="fastBadge" hidden>FAST CHARGING CONFIRMED</div>
            <div class="meters" id="meters" hidden>
              <div class="meter">
                <span class="meter-label">VOLTAGE</span>
                <span class="meter-value" id="voltage">—</span>
              </div>
              <div class="meter-divider" aria-hidden="true"></div>
              <div class="meter">
                <span class="meter-label">CURRENT</span>
                <span class="meter-value" id="current">—</span>
              </div>
              <div class="meter-divider" aria-hidden="true"></div>
              <div class="meter">
                <span class="meter-label">POWER</span>
                <span class="meter-value" id="power">—</span>
              </div>
            </div>
          </section>

          <div class="orbs" aria-hidden="true">
            <span class="orb orb-a"></span>
            <span class="orb orb-b"></span>
          </div>

          <canvas class="flower-field" id="flowerField" aria-hidden="true"></canvas>
          <div class="charge-socket" id="chargeSocket" hidden aria-hidden="true">
            <span class="socket-glow"></span>
            <span class="socket-port"></span>
          </div>
        </div>
      </div>
      <p class="caption">Open on iPhone · tap Connect charger</p>
    </div>

    <div class="controls">
      <button type="button" class="cta" id="toggleCharge" aria-pressed="false">
        Connect charger
      </button>
      <label class="slider-label">
        Battery
        <input type="range" id="level" min="1" max="100" value="64" />
      </label>
    </div>
  </main>
  <script>
const screen = document.getElementById("screen");
const toggle = document.getElementById("toggleCharge");
const levelInput = document.getElementById("level");
const percentEl = document.getElementById("percent");
const laPercent = document.getElementById("laPercent");
const statusBattery = document.getElementById("statusBattery");
const chargeLabel = document.getElementById("chargeLabel");
const watts = document.getElementById("watts");
const liveActivity = document.getElementById("liveActivity");
const ringProgress = document.getElementById("ringProgress");
const clock = document.getElementById("clock");
const fastBadge = document.getElementById("fastBadge");
const meters = document.getElementById("meters");
const voltageEl = document.getElementById("voltage");
const currentEl = document.getElementById("current");
const powerEl = document.getElementById("power");
const chargeSocket = document.getElementById("chargeSocket");
const flowerCanvas = document.getElementById("flowerField");
const flowerCtx = flowerCanvas.getContext("2d");

const CIRCUMFERENCE = 2 * Math.PI * 86;
ringProgress.style.strokeDasharray = String(CIRCUMFERENCE);

const PALETTE = [
  "#ff739e", "#ffb847", "#8cd1ff", "#b88cff", "#73ebb2",
  "#ff8c4d", "#ffd966", "#f25858", "#59bfff", "#ffe08a",
];

const SCENES = [
  "flower", "rocket", "drone", "train", "ferrari", "scooter",
  "fish", "sparrows", "snake", "sunrise", "popcorn", "beach",
];

const SCENE_TITLE = {
  flower: "Flowers",
  rocket: "Rocket",
  drone: "Drone",
  train: "Train",
  ferrari: "Ferrari",
  scooter: "Scooter",
  fish: "Fish",
  sparrows: "Sparrows",
  snake: "Snake",
  sunrise: "Sunrise",
  popcorn: "Popcorn",
  beach: "Sea beach",
};

let charging = false;
let level = Number(levelInput.value);
let particles = [];
let scene = randomScene();
let nextSceneAt = performance.now() + 4000;
let sceneLabelEl = null;

function ensureSceneLabel() {
  if (sceneLabelEl) return sceneLabelEl;
  sceneLabelEl = document.createElement("div");
  sceneLabelEl.className = "scene-label";
  screen.appendChild(sceneLabelEl);
  return sceneLabelEl;
}

function randomScene(exclude) {
  let next = SCENES[(Math.random() * SCENES.length) | 0];
  while (exclude && next === exclude && SCENES.length > 1) {
    next = SCENES[(Math.random() * SCENES.length) | 0];
  }
  return next;
}

function tickClock() {
  const now = new Date();
  clock.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function estimateElectricals(pct, isCharging) {
  if (!isCharging) return { v: 0, a: 0, w: 0, fast: false, mode: "Unplugged", label: "ON BATTERY" };
  if (pct >= 100) return { v: 5.0, a: 0.05, w: 0.3, fast: false, mode: "Fully charged", label: "FULLY CHARGED" };
  const jV = (Math.random() - 0.5) * 0.12;
  const jA = (Math.random() - 0.5) * 0.1;
  let v; let a; let fast; let mode;
  if (pct < 50) { v = 9.2 + jV; a = 3.35 + jA; fast = true; mode = "Fast charging"; }
  else if (pct < 80) { v = 9.0 + jV; a = 2.45 + jA; fast = true; mode = "Fast charging"; }
  else if (pct < 92) { v = 5.2 + jV * 0.4; a = 1.15 + jA * 0.4; fast = false; mode = "Standard charge"; }
  else { v = 5.1 + jV * 0.25; a = 0.55 + jA * 0.25; fast = false; mode = "Trickle charge"; }
  v = Math.max(4.8, v); a = Math.max(0.05, a);
  return {
    v: Math.round(v * 10) / 10,
    a: Math.round(a * 100) / 100,
    w: Math.round(v * a * 10) / 10,
    fast,
    mode,
    label: fast ? "FAST CHARGING" : "CHARGING",
  };
}

function resizeCanvas() {
  const rect = screen.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  flowerCanvas.width = Math.floor(rect.width * dpr);
  flowerCanvas.height = Math.floor(rect.height * dpr);
  flowerCanvas.style.width = `${rect.width}px`;
  flowerCanvas.style.height = `${rect.height}px`;
  flowerCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function spawn(count) {
  const w = flowerCanvas.clientWidth;
  const h = flowerCanvas.clientHeight;
  for (let i = 0; i < count; i += 1) {
    particles.push({
      born: performance.now(),
      life: 2000 + Math.random() * 2000,
      rise: h * (0.45 + Math.random() * 0.5),
      drift: (Math.random() - 0.5) * w * 0.8,
      amp: 10 + Math.random() * 24,
      freq: 0.6 + Math.random() * 1.6,
      phase: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 3,
      scale: 0.5 + Math.random() * 0.85,
      color: PALETTE[(Math.random() * PALETTE.length) | 0],
      scene,
      petals: 4 + ((Math.random() * 3) | 0),
    });
  }
  if (particles.length > 160) particles.splice(0, particles.length - 160);
}

function pos(p, t, sx, sy, w) {
  const tt = t;
  switch (p.scene) {
    case "rocket":
      return [sx + Math.sin(t * 6 + p.phase) * 10, sy - tt * p.rise * 1.15];
    case "drone":
      return [sx + p.drift * tt, sy - tt * p.rise * 0.85 + Math.sin(t * Math.PI * 4 + p.phase) * 16];
    case "train":
    case "ferrari":
    case "scooter":
      return [sx + Math.sign(p.drift || 1) * Math.abs(p.drift) * tt * 1.35, sy - 20 - Math.sin(tt * Math.PI) * 12 - tt * 28];
    case "fish":
      return [sx + p.drift * tt, sy - tt * p.rise * 0.7 + Math.sin(t * Math.PI * 3 + p.phase) * p.amp];
    case "sparrows":
      return [sx + p.drift * tt, sy - tt * p.rise + Math.sin(t * Math.PI * 8 + p.phase) * 10];
    case "snake":
      return [sx + Math.sin(t * Math.PI * 5 + p.phase) * p.amp * 1.6, sy - tt * p.rise];
    case "sunrise": {
      const arc = tt * Math.PI;
      return [sx + Math.cos(arc + p.phase) * p.amp * 2.2, sy - Math.sin(arc) * p.rise * 0.85];
    }
    case "beach":
      return [sx + p.drift * tt, sy - 40 - tt * p.rise * 0.45 + Math.sin(t * Math.PI * 2 + p.phase) * 14];
    default: {
      const sway = Math.sin(t * Math.PI * 2 * p.freq + p.phase) * p.amp;
      return [sx + p.drift * tt + sway, sy - tt * p.rise];
    }
  }
}

function drawShape(ctx, p, rot) {
  ctx.save();
  ctx.rotate(rot);
  ctx.fillStyle = p.color;
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  switch (p.scene) {
    case "flower": {
      for (let i = 0; i < p.petals; i += 1) {
        const a = (i / p.petals) * Math.PI * 2 - Math.PI / 2;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * 5, Math.sin(a) * 5, 2.2, 3.2, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, Math.PI * 2); ctx.fillStyle = "#ffe08a"; ctx.fill();
      break;
    }
    case "rocket": {
      ctx.beginPath();
      ctx.moveTo(0, -7); ctx.lineTo(4, 2); ctx.lineTo(2, 2); ctx.lineTo(3, 6);
      ctx.lineTo(-3, 6); ctx.lineTo(-2, 2); ctx.lineTo(-4, 2); ctx.closePath(); ctx.fill();
      break;
    }
    case "drone": {
      ctx.beginPath(); ctx.ellipse(0, 0, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-5.5, -3, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5.5, -3, 2.4, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case "train": {
      roundRect(ctx, -7, -3, 14, 7, 1.5); ctx.fill();
      ctx.beginPath(); ctx.arc(-3.5, 4.5, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(3.5, 4.5, 1.6, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case "ferrari": {
      ctx.beginPath();
      ctx.moveTo(-8, 2); ctx.lineTo(-6, -2); ctx.lineTo(-2, -4); ctx.lineTo(3, -4);
      ctx.lineTo(7, -1); ctx.lineTo(8, 2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(-3.5, 2.5, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, 2.5, 1.5, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case "scooter": {
      ctx.beginPath(); ctx.arc(-4.5, 3.5, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4.5, 3.5, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4, 3); ctx.lineTo(4, 3); ctx.lineTo(5, -4); ctx.lineTo(3, -5); ctx.stroke();
      break;
    }
    case "fish": {
      ctx.beginPath(); ctx.ellipse(-1, 0, 4.5, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(7, -3); ctx.lineTo(7, 3); ctx.closePath(); ctx.fill();
      break;
    }
    case "sparrows": {
      ctx.beginPath();
      ctx.moveTo(-6, 0);
      ctx.quadraticCurveTo(-3, -5, 0, -2);
      ctx.quadraticCurveTo(3, -5, 6, 0);
      ctx.quadraticCurveTo(2, 1, 0, 1);
      ctx.quadraticCurveTo(-2, 1, -6, 0);
      ctx.fill();
      break;
    }
    case "snake": {
      ctx.beginPath();
      ctx.moveTo(-7, 2);
      ctx.bezierCurveTo(-5, -4, -3, 4, -2, -2);
      ctx.bezierCurveTo(0, -6, 2, 5, 4, 1);
      ctx.bezierCurveTo(6, -3, 7, 2, 8, -2);
      ctx.stroke();
      break;
    }
    case "sunrise": {
      ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 8; i += 1) {
        const a = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 4, Math.sin(a) * 4);
        ctx.lineTo(Math.cos(a) * 7, Math.sin(a) * 7);
        ctx.stroke();
      }
      break;
    }
    case "popcorn": {
      ctx.beginPath(); ctx.arc(-1, -2, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(1.5, 0, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-2, 1, 2.2, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case "beach": {
      ctx.beginPath();
      ctx.moveTo(0, -5);
      ctx.quadraticCurveTo(6, -3, 6, 3);
      ctx.quadraticCurveTo(0, 6, -6, 3);
      ctx.quadraticCurveTo(-6, -3, 0, -5);
      ctx.fill();
      break;
    }
    default: break;
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackdrop(ctx, w, h) {
  if (scene === "sunrise") {
    const g = ctx.createRadialGradient(w * 0.5, h * 0.42, 4, w * 0.5, h * 0.42, 90);
    g.addColorStop(0, "rgba(255,160,40,0.5)");
    g.addColorStop(0.5, "rgba(255,210,80,0.16)");
    g.addColorStop(1, "rgba(255,160,40,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(w * 0.5, h * 0.42, 90, 0, Math.PI * 2); ctx.fill();
  }
  if (scene === "beach") {
    ctx.fillStyle = "rgba(40,130,200,0.22)";
    ctx.beginPath();
    ctx.moveTo(0, h * 0.72);
    ctx.quadraticCurveTo(w * 0.5, h * 0.68, w, h * 0.74);
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
  }
}

function paint(now) {
  const w = flowerCanvas.clientWidth;
  const h = flowerCanvas.clientHeight;
  flowerCtx.clearRect(0, 0, w, h);
  if (!charging) return;

  if (now >= nextSceneAt) {
    scene = randomScene(scene);
    nextSceneAt = now + 3200 + Math.random() * 2000;
    spawn(12 + ((Math.random() * 8) | 0));
    const label = ensureSceneLabel();
    label.textContent = SCENE_TITLE[scene].toUpperCase();
    label.hidden = false;
  }

  drawBackdrop(flowerCtx, w, h);
  const sx = w * 0.5;
  const sy = h - 14;
  particles = particles.filter((p) => now - p.born < p.life);
  for (const p of particles) {
    const t = (now - p.born) / p.life;
    const [x, y] = pos(p, t, sx, sy, w);
    const opacity = Math.max(0, 1 - t ** 1.5);
    const scale = p.scale * (0.4 + 0.6 * (1 - Math.abs(t - 0.3)));
    flowerCtx.save();
    flowerCtx.globalAlpha = opacity;
    flowerCtx.translate(x, y);
    flowerCtx.scale(scale, scale);
    drawShape(flowerCtx, p, p.spin * t * Math.PI * 2);
    flowerCtx.restore();
  }
  flowerCtx.globalAlpha = 1;
}

function loop(now) {
  if (charging && Math.random() < 0.6) spawn(1 + ((Math.random() * 3) | 0));
  paint(now || performance.now());
  requestAnimationFrame(loop);
}

function render() {
  const pct = Math.round(level);
  const elec = estimateElectricals(pct, charging);
  percentEl.textContent = String(pct);
  laPercent.textContent = `${pct}%`;
  statusBattery.textContent = String(pct);
  ringProgress.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - level / 100));
  screen.classList.toggle("is-charging", charging);
  liveActivity.hidden = !charging;
  chargeSocket.hidden = !charging;
  meters.hidden = !charging;
  toggle.setAttribute("aria-pressed", charging ? "true" : "false");
  toggle.textContent = charging ? "Unplug charger" : "Connect charger";

  const label = ensureSceneLabel();
  if (!charging) {
    chargeLabel.textContent = "ON BATTERY";
    watts.textContent = "Plug in to wake Aura";
    fastBadge.hidden = true;
    particles = [];
    label.hidden = true;
    flowerCtx.clearRect(0, 0, flowerCanvas.clientWidth, flowerCanvas.clientHeight);
    return;
  }

  label.hidden = false;
  label.textContent = SCENE_TITLE[scene].toUpperCase();
  chargeLabel.textContent = elec.label;
  voltageEl.textContent = `${elec.v.toFixed(1)} V`;
  currentEl.textContent = `${elec.a.toFixed(2)} A`;
  powerEl.textContent = `${elec.w.toFixed(0)} W`;
  fastBadge.hidden = false;
  if (elec.fast) {
    fastBadge.textContent = "FAST CHARGING CONFIRMED";
    fastBadge.classList.remove("is-standard");
    watts.textContent = `Fast charging confirmed · ${elec.w.toFixed(0)} W`;
  } else {
    fastBadge.textContent = elec.mode.toUpperCase();
    fastBadge.classList.add("is-standard");
    watts.textContent = pct >= 100 ? `Holding 100% · ${elec.v.toFixed(1)} V` : `${elec.mode} · ${elec.w.toFixed(0)} W`;
  }
}

toggle.addEventListener("click", () => {
  charging = !charging;
  if (charging) {
    scene = randomScene();
    nextSceneAt = performance.now() + 4000;
    spawn(16);
  }
  render();
});

levelInput.addEventListener("input", () => {
  level = Number(levelInput.value);
  render();
});

setInterval(() => {
  if (charging && level < 100) {
    level = Math.min(100, level + 0.35);
    levelInput.value = String(Math.round(level));
  }
  render();
}, 1200);

window.addEventListener("resize", resizeCanvas);
tickClock();
setInterval(tickClock, 30_000);
resizeCanvas();
render();
requestAnimationFrame(loop);

  </script>
</body>
